<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#18181b">
    <title>Offline - HoverEffects</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #09090b; color: #f4f4f5; font: 16px/1.5 system-ui, sans-serif; }
      main { width: min(100%, 32rem); border: 1px solid #27272a; padding: 2rem; background: #111113; text-align: center; }
      h1 { margin: 0 0 .5rem; font-size: 1.5rem; }
      p { margin: 0 0 1.5rem; color: #a1a1aa; }
      a { display: inline-block; padding: .7rem 1rem; background: #f4f4f5; color: #18181b; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #818cf8; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Reconnect to browse and copy HoverEffects.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
